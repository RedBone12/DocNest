name: Browser acceptance
on:
  pull_request:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      COMPOSE_PARALLEL_LIMIT: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/distributed-document-search-engine-ui-main/package-lock.json
      - name: Build pinned MinIO
        run: docker build -t docnest/minio-ci:2025-09-07 -f backend/distributed-document-search-engine-main/infra/minio-ci.Dockerfile backend/distributed-document-search-engine-main/infra
      - name: Start isolated application stack
        run: docker compose --env-file deploy/.env.example -f deploy/compose.yaml up -d --build --wait --wait-timeout 600
      - name: Synthetic storage backup and restore drill
        shell: pwsh
        run: ./deploy/recovery-drill.ps1 -OutputRoot "${{ runner.temp }}/docnest-recovery"
      - name: Install browser test dependencies
        working-directory: frontend/distributed-document-search-engine-ui-main
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Run real browser acceptance
        working-directory: frontend/distributed-document-search-engine-ui-main
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-acceptance-reports
          path: |
            frontend/distributed-document-search-engine-ui-main/playwright-report/
            frontend/distributed-document-search-engine-ui-main/test-results/
      - name: Stop isolated stack
        if: always()
        run: docker compose --env-file deploy/.env.example -f deploy/compose.yaml down
