server:
  port: 8080

docnest:
  cors-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:[*],http://127.0.0.1:[*]}
  auth-service-url: ${AUTH_SERVICE_URL:http://localhost:8081}

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      routes:
        # Document Service - documents endpoints
        - id: document-service-docs
          uri: ${DOCUMENT_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/documents/**

        # Document Service - auth endpoints
        - id: document-service-auth
          uri: ${DOCUMENT_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/auth/**

        # Search Service
        - id: search-service
          uri: ${SEARCH_SERVICE_URL:http://localhost:8083}
          predicates:
            - Path=/search/**

      default-filters:
        - RemoveRequestHeader=Cookie

  jpa:
    hibernate:
      ddl-auto: none

logging:
  level:
    root: INFO
    com.priyanshu.api_gateway: DEBUG
    org.springframework.security: INFO
    org.springframework.cloud.gateway: INFO
    org.springframework.web: INFO
  pattern:
    console: "%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/api-gateway.log
    max-size: 10MB
    max-history: 10

security:
  jwt:
    secret: ${JWT_SECRET}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized
