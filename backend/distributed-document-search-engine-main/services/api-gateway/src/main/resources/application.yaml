server:
  port: 8080

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      routes:
        # Document Service - documents endpoints
        - id: document-service-docs
          uri: http://localhost:8081
          predicates:
            - Path=/documents/**

        # Document Service - auth endpoints
        - id: document-service-auth
          uri: http://localhost:8081
          predicates:
            - Path=/auth/**

        # Search Service
        - id: search-service
          uri: http://localhost:8083
          predicates:
            - Path=/search/**

      default-filters:
        - RemoveRequestHeader=Cookie

  jpa:
    hibernate:
      ddl-auto: none

  cors:
    allowed-origins: http://localhost:3000,http://localhost:3001,http://127.0.0.1:3000
    allowed-methods: GET,POST,PUT,DELETE,OPTIONS,PATCH
    allowed-headers: "*"
    allow-credentials: "true"
    max-age: 3600

logging:
  level:
    root: INFO
    com.priyanshu.api_gateway: DEBUG
    org.springframework.security: DEBUG
    org.springframework.cloud.gateway: DEBUG
    org.springframework.web: INFO
  pattern:
    console: "%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/api-gateway.log
    max-size: 10MB
    max-history: 10

security:
  jwt:
    secret: ${JWT_SECRET}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized
