management:
  server:
    port: 9090
    address: 0.0.0.0
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
logging:
  level:
    root: INFO
    org.springframework.web: WARN
    org.springframework.security: WARN
