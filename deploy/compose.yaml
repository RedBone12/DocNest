name: docnest-app
x-app: &app
  restart: unless-stopped
  environment: &environment
    SPRING_PROFILES_ACTIVE: container
    JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
    POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-documents_db}
    MINIO_URL: http://minio:9000
    MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
    MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
    SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    SPRING_DATA_REDIS_HOST: redis
    ELASTICSEARCH_HOST: elasticsearch
    DOCNEST_DOCUMENT_SERVICE_URL: http://document-service:8081
  healthcheck:
    test: [CMD, curl, -fsS, http://localhost:9090/actuator/health/readiness]
    start_period: 60s
    interval: 10s
    timeout: 5s
    retries: 24
services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    environment: {ZOOKEEPER_CLIENT_PORT: 2181}
    volumes: [zookeeper-data:/var/lib/zookeeper/data]
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    depends_on: [zookeeper]
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    volumes: [kafka-data:/var/lib/kafka/data]
    healthcheck:
      test: [CMD-SHELL, 'kafka-broker-api-versions --bootstrap-server localhost:9092 >/dev/null 2>&1']
      interval: 10s
      timeout: 10s
      retries: 30
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-documents_db}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 30
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.1
    environment:
      discovery.type: single-node
      xpack.security.enabled: 'false'
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    volumes: [es-data:/usr/share/elasticsearch/data]
    healthcheck:
      test: [CMD, curl, -fsS, 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s']
      interval: 10s
      timeout: 10s
      retries: 30
  redis:
    image: redis:7
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 5s
      retries: 30
  minio:
    image: ${MINIO_IMAGE:-docnest/minio-ci:2025-09-07}
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
    volumes: [minio-data:/data]
    healthcheck:
      test: [CMD, curl, -fsS, http://localhost:9000/minio/health/live]
      interval: 5s
      timeout: 5s
      retries: 30
  document-service:
    <<: *app
    build:
      context: ..
      dockerfile: deploy/backend.Dockerfile
      args: {SERVICE: document-service}
    environment:
      <<: *environment
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:8088}
    depends_on:
      postgres: {condition: service_healthy}
      kafka: {condition: service_healthy}
      minio: {condition: service_healthy}
  indexing-service:
    <<: *app
    build:
      context: ..
      dockerfile: deploy/backend.Dockerfile
      args: {SERVICE: indexing-service}
    depends_on:
      document-service: {condition: service_healthy}
      elasticsearch: {condition: service_healthy}
      redis: {condition: service_healthy}
  search-service:
    <<: *app
    build:
      context: ..
      dockerfile: deploy/backend.Dockerfile
      args: {SERVICE: search-service}
    depends_on:
      elasticsearch: {condition: service_healthy}
      redis: {condition: service_healthy}
  api-gateway:
    <<: *app
    build:
      context: ..
      dockerfile: deploy/backend.Dockerfile
      args: {SERVICE: api-gateway}
    environment:
      <<: *environment
      DOCUMENT_SERVICE_URL: http://document-service:8081
      SEARCH_SERVICE_URL: http://search-service:8083
      AUTH_SERVICE_URL: http://document-service:8081
      CORS_ALLOWED_ORIGINS: ${FRONTEND_URL:-http://localhost:8088}
    depends_on:
      document-service: {condition: service_healthy}
      search-service: {condition: service_healthy}
  frontend:
    restart: unless-stopped
    build: {context: .., dockerfile: deploy/frontend.Dockerfile}
    ports: ['${BIND_ADDRESS:-127.0.0.1}:${HTTP_PORT:-8088}:8080']
    depends_on:
      api-gateway: {condition: service_healthy}
    healthcheck:
      test: [CMD, wget, -q, --spider, http://127.0.0.1:8080/]
      interval: 10s
      timeout: 5s
      retries: 12
volumes:
  postgres-data:
  kafka-data:
  zookeeper-data:
  es-data:
  minio-data:
