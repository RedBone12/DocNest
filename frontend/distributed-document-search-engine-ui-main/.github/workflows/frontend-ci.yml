name: Frontend checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: TypeScript and production build
        env:
          VITE_API_BASE_URL: http://localhost:8080
        run: npm run build
      - name: ESLint
        run: npm run lint
      - name: API behavior tests
        run: npm test
